name: Build (HTML + Android APK + Windows EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      toza:
        description: "Toza nusxa (ichida tovar va savdo ma'lumotlari yo'q)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: 1.3.${{ github.run_number }}
  SUFFIX: ${{ inputs.toza && '-toza' || '' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build single-file app
        env:
          GMZ_CLEAN: ${{ inputs.toza && '1' || '' }}
        run: |
          npm i -g esbuild@0.23.1
          python3 tools/build.py web/GM_Zapchast.html
      - name: Package HTML version
        run: |
          mkdir -p out/GM_Zapchast
          cp web/GM_Zapchast.html web/GM_Zapchast_ishga_tushirish.bat out/GM_Zapchast/
          cd out && zip -r ../GM_Zapchast_HTML.zip GM_Zapchast
      - uses: actions/upload-artifact@v4
        with: { name: web, path: "web/GM_Zapchast.html" }
      - uses: actions/upload-artifact@v4
        with: { name: html-zip, path: GM_Zapchast_HTML.zip }

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" && ls $ANDROID_HOME/build-tools | tail -3
      - name: Prepare Capacitor project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          mkdir -p www && cp ../web/GM_Zapchast.html www/index.html
          if [ -f node_modules/@capacitor/core/dist/capacitor.js ]; then
            cp node_modules/@capacitor/core/dist/capacitor.js www/
            python3 -c "p='www/index.html';s=open(p,encoding='utf-8').read();s=s.replace('<head>','<head><script src=\"capacitor.js\"></script>',1);open(p,'w',encoding='utf-8').write(s)"
          fi
          npx cap add android
          npx capacitor-assets generate --android || echo "icon generation skipped"
          python3 - <<'PY'
          import re,os
          m='android/app/src/main/AndroidManifest.xml'
          s=open(m).read()
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.CAMERA" />\n    <application',1)
          if 'mlkit.vision.DEPENDENCIES' not in s:
              s=s.replace('</application>','    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\n    </application>',1)
          open(m,'w').write(s)
          g='android/app/build.gradle'
          s=open(g).read()
          n=os.environ['GITHUB_RUN_NUMBER']
          s=re.sub(r'versionCode \d+','versionCode '+str(100+int(n)),s)
          s=re.sub(r'versionName "[^"]*"','versionName "'+os.environ['VERSION']+'"',s)
          open(g,'w').write(s)
          PY
          npx cap sync android
      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KS_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ks.p12; else cp mobile/signing/gmz-release.keystore ks.p12; fi
          if [ -z "$KS_PASS" ]; then export KS_PASS="$(tr -d '\r\n' < mobile/signing/password.txt)"; fi
          $BT/apksigner sign --ks ks.p12 --ks-type PKCS12 --ks-key-alias gmz --ks-pass env:KS_PASS --key-pass env:KS_PASS --out GM-Zapchast-${VERSION}${SUFFIX}.apk aligned.apk
          $BT/apksigner verify --print-certs GM-Zapchast-${VERSION}${SUFFIX}.apk | head -3
          rm ks.p12
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: "GM-Zapchast-*.apk" }

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build EXE
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          mkdir -p app && cp ../web/GM_Zapchast.html app/index.html
          npm version $VERSION --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
          if [ -n "$SUFFIX" ]; then for f in dist/*.exe; do mv "$f" "${f%.exe}${SUFFIX}.exe"; done; fi
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: "desktop/dist/*.exe" }

  release:
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}${{ env.SUFFIX }}
          name: GM Zapchast ${{ env.VERSION }}${{ inputs.toza && ' (toza nusxa)' || '' }}
          body: |
            ${{ inputs.toza && 'TOZA NUSXA: ichida tovar va savdo ma''lumotlari yo''q, birinchi ishga tushirishdan boshlanadi.' || '' }}
            - GM-Zapchast-${{ env.VERSION }}.apk — Android telefon uchun
            - GM-Zapchast-Setup-${{ env.VERSION }}.exe — Windows o'rnatuvchi
            - GM-Zapchast-portable-${{ env.VERSION }}.exe — o'rnatmasdan ishlaydigan
            - GM_Zapchast_HTML.zip — brauzer (HTML) versiyasi
          files: |
            dist/*.apk
            dist/*.exe
            dist/GM_Zapchast_HTML.zip
